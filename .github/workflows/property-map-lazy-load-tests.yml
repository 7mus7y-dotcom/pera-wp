name: Property Map Google API lazy-loading regression

on:
  pull_request:
    paths:
      - 'wp-content/themes/hello-elementor-child/js/property-map.js'
      - 'wp-content/themes/hello-elementor-child/inc/modules/enqueue-assets.php'
      - 'wp-content/themes/hello-elementor-child/tests/property-map-lazy-load-test.js'
      - 'wp-content/themes/hello-elementor-child/tests/property-map-currency-test.js'
      - '.github/workflows/property-map-lazy-load-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property-map-lazy-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: php -l wp-content/themes/hello-elementor-child/inc/modules/enqueue-assets.php
      - name: JavaScript syntax
        run: |
          node --check wp-content/themes/hello-elementor-child/js/property-map.js
          node --check wp-content/themes/hello-elementor-child/js/property-map-lazy-load-test.js
      - name: Lazy-load trigger and fallback tests
        run: node wp-content/themes/hello-elementor-child/tests/property-map-lazy-load-test.js
      - name: Existing map price and filter regression
        run: node wp-content/themes/hello-elementor-child/tests/property-map-currency-test.js
