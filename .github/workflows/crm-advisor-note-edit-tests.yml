name: CRM advisor note inline-edit regression

on:
  pull_request:
    paths:
      - 'wp-content/plugins/peracrm/inc/repositories/notes.php'
      - 'wp-content/plugins/peracrm/inc/views/pages/crm-client.php'
      - 'wp-content/plugins/peracrm/inc/frontend-data/crm-client-view.php'
      - 'wp-content/plugins/peracrm/inc/admin/admin.php'
      - 'wp-content/plugins/peracrm/inc/admin/actions.php'
      - 'wp-content/plugins/peracrm/assets/frontend/crm.js'
      - 'wp-content/plugins/peracrm/assets/frontend/crm.css'
      - 'wp-content/plugins/peracrm/tests/advisor-note-inline-edit-test.js'
      - '.github/workflows/crm-advisor-note-edit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note-inline-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l wp-content/plugins/peracrm/inc/repositories/notes.php
          php -l wp-content/plugins/peracrm/inc/views/pages/crm-client.php
          php -l wp-content/plugins/peracrm/inc/frontend-data/crm-client-view.php
          php -l wp-content/plugins/peracrm/inc/admin/admin.php
          php -l wp-content/plugins/peracrm/inc/admin/actions.php
      - name: JavaScript syntax and structural regression
        run: |
          node --check wp-content/plugins/peracrm/assets/frontend/crm.js
          node wp-content/plugins/peracrm/tests/advisor-note-inline-edit-test.js
