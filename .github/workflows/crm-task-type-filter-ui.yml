name: CRM task type filters on Overview and Tasks
on:
  pull_request:
    paths:
      - 'wp-content/plugins/peracrm/inc/views/pages/crm-overview.php'
      - 'wp-content/plugins/peracrm/assets/frontend/crm.css'
      - 'wp-content/plugins/peracrm/tests/task-type-filter-ui-test.js'
      - '.github/workflows/crm-task-type-filter-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-type-filters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP lint
        run: php -l wp-content/plugins/peracrm/inc/views/pages/crm-overview.php
      - name: Task type filtering regression
        run: node wp-content/plugins/peracrm/tests/task-type-filter-ui-test.js
