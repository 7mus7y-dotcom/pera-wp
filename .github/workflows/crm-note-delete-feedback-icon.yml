name: CRM note delete feedback and phone icon
on:
  pull_request:
    paths:
      - 'wp-content/plugins/peracrm/assets/frontend/crm.js'
      - 'wp-content/plugins/peracrm/inc/views/pages/crm-client.php'
      - 'wp-content/plugins/peracrm/tests/note-delete-feedback-icon-cache-test.js'
      - '.github/workflows/crm-note-delete-feedback-icon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notes-feedback-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP and JS syntax
        run: |
          php -l wp-content/plugins/peracrm/inc/views/pages/crm-client.php
          node --check wp-content/plugins/peracrm/assets/frontend/crm.js
      - name: CRM note feedback and icon regression
        run: node wp-content/plugins/peracrm/tests/note-delete-feedback-icon-cache-test.js
