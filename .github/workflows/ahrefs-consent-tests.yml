name: Ahrefs analytics consent regression

on:
  pull_request:
    paths:
      - 'wp-content/themes/hello-elementor-child/inc/modules/analytics.php'
      - 'wp-content/themes/hello-elementor-child/inc/modules/analytics/ahrefs.php'
      - 'wp-content/themes/hello-elementor-child/js/main.js'
      - 'wp-content/themes/hello-elementor-child/tests/ahrefs-consent-test.js'
      - '.github/workflows/ahrefs-consent-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ahrefs-consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l wp-content/themes/hello-elementor-child/inc/modules/analytics.php
          php -l wp-content/themes/hello-elementor-child/inc/modules/analytics/ahrefs.php
      - name: JavaScript syntax
        run: |
          node --check wp-content/themes/hello-elementor-child/js/main.js
          node --check wp-content/themes/hello-elementor-child/tests/ahrefs-consent-test.js
      - name: Ahrefs consent regression
        run: node wp-content/themes/hello-elementor-child/tests/ahrefs-consent-test.js
