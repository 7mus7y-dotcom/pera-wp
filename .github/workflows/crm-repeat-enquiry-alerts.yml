name: PeraCRM repeat enquiry review queue
on:
  pull_request:
    paths:
      - 'wp-content/plugins/peracrm/inc/integrations/enquiries.php'
      - 'wp-content/plugins/peracrm/inc/repeat-enquiries.php'
      - 'wp-content/plugins/peracrm/inc/bootstrap.php'
      - 'wp-content/plugins/peracrm/inc/views/pages/crm-overview.php'
      - 'wp-content/plugins/peracrm/tests/repeat-enquiries-queue-test.js'
      - '.github/workflows/crm-repeat-enquiry-alerts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeat-enquiry-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l wp-content/plugins/peracrm/inc/integrations/enquiries.php
          php -l wp-content/plugins/peracrm/inc/repeat-enquiries.php
          php -l wp-content/plugins/peracrm/inc/bootstrap.php
          php -l wp-content/plugins/peracrm/inc/views/pages/crm-overview.php
      - name: Repeat enquiry queue regression
        run: node wp-content/plugins/peracrm/tests/repeat-enquiries-queue-test.js
